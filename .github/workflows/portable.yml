name: Docker quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run the shared Docker lane
        run: node tests/docker/run.mjs output/verification-ci/docker
      - name: Preserve evidence, not source contexts or VM disks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-quality-${{ github.sha }}
          path: |
            output/verification-ci/docker/*.json
            output/verification-ci/docker/*.log
            output/verification-ci/docker/*.txt
          if-no-files-found: warn
          retention-days: 14
