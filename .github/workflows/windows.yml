name: Windows quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.2"
          cache-dependency-path: tools/workspace-storage-host/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Canonicalize runner temporary directory
        shell: pwsh
        run: |
          # Positive fixtures use real paths; production redirection checks stay strict.
          # Hosted TEMP may contain RUNNER~1 even though realpath returns runneradmin.
          node --input-type=module -e 'import fs from "node:fs"; import os from "node:os"; const temp = fs.realpathSync.native(os.tmpdir()); if (/[\r\n]/.test(temp)) throw new Error("Invalid temporary directory"); fs.appendFileSync(process.env.GITHUB_ENV, `TEMP=${temp}\nTMP=${temp}\n`);'
      - name: Preflight native metadata replay
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/quality -Force | Out-Null
          go -C tools/workspace-storage-host test ./... -run '^(TestRestoreMetadata|TestRestoreDirectoryMetadata|TestRestoreCompressedMetadata|TestStoreRestoreNative)' -count=1 -timeout=120s 2>&1 | Tee-Object -FilePath artifacts/quality/metadata-replay.log
          exit $LASTEXITCODE
      - name: Verify source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/quality -Force | Out-Null
          pnpm verify 2>&1 | Tee-Object -FilePath artifacts/quality/verify.log
          exit $LASTEXITCODE
      - name: Verify complete discovered test inventory including Windows-only cases
        shell: pwsh
        run: |
          node tests/docker/prepare-go.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/docker/run-portable.mjs 2>&1 | Tee-Object -FilePath artifacts/quality/windows-suite.log
          exit $LASTEXITCODE
      - name: Verify CLI package
        shell: pwsh
        run: |
          pnpm --filter honeybee-cli package:smoke 2>&1 | Tee-Object -FilePath artifacts/quality/cli-package.log
          exit $LASTEXITCODE
      - name: Compile small native QA binaries for the toolchain-free VM
        shell: pwsh
        run: node scripts/qualification/build-native-tests.mjs artifacts/quality/native-tests
      - name: Verify Desktop package and PTY
        shell: pwsh
        run: |
          pnpm --filter honeybee-desktop package:smoke 2>&1 | Tee-Object -FilePath artifacts/quality/desktop-package.log
          exit $LASTEXITCODE
      - name: Verify stable Launcher and CLI shim
        shell: pwsh
        run: |
          pnpm build:launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm smoke:launcher 2>&1 | Tee-Object -FilePath artifacts/quality/launcher-smoke.log
          exit $LASTEXITCODE
      - name: Verify assembled installation
        shell: pwsh
        run: |
          pnpm prepare:installation-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installationRoot = node scripts/installation/assemble.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/installation/smoke.mjs $installationRoot 2>&1 | Tee-Object -FilePath artifacts/quality/installation-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/update/smoke-prepare.mjs (Join-Path $installationRoot "versions/$appVersion") 2>&1 | Tee-Object -FilePath artifacts/quality/update-prepare-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath $installationRoot -DestinationPath artifacts/quality/HoneyBee-installation-preview-win32-x64.zip
          # Development preview compiler; production signing/toolchain qualification is separate.
          New-Item -ItemType Directory -Force output/nsis-preview | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z' -OutFile output/nsis-preview/compiler.7z
          if ((Get-FileHash output/nsis-preview/compiler.7z -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa') { throw 'NSIS preview compiler digest mismatch' }
          tar -xf output/nsis-preview/compiler.7z -C output/nsis-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HONEYBEE_MAKENSIS = Join-Path (Get-Location) 'output/nsis-preview/Bin/makensis.exe'
          $setupPath = node scripts/installation/build-setup.mjs $installationRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/installation/smoke-setup.mjs $setupPath 2>&1 | Tee-Object -FilePath artifacts/quality/setup-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $setupPath -Destination artifacts/quality/HoneyBeeSetup-preview.exe
      - name: Archive tested packages
        shell: pwsh
        env:
          HONEYBEE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Compress-Archive -LiteralPath apps/cli/release/HoneyBee-cli-win32-x64 -DestinationPath artifacts/quality/HoneyBee-cli-win32-x64.zip
          Compress-Archive -LiteralPath apps/desktop/release/HoneyBee-win32-x64 -DestinationPath artifacts/quality/HoneyBee-win32-x64.zip
          Get-FileHash artifacts/quality/*.zip, artifacts/quality/*.exe -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path)
          } | Set-Content -Encoding utf8 artifacts/quality/SHA256SUMS.txt
          git rev-parse HEAD | Set-Content -Encoding utf8 artifacts/quality/source-commit.txt
          $env:HONEYBEE_PR_HEAD | Set-Content -Encoding utf8 artifacts/quality/pr-head.txt
      - name: Write source-bound Windows receipt
        if: always()
        shell: pwsh
        env:
          QUALITY_JOB_STATUS: ${{ job.status }}
        run: node scripts/qualification/windows-quality-receipt.mjs artifacts/quality $env:QUALITY_JOB_STATUS
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/quality/
          if-no-files-found: warn
          retention-days: 14
